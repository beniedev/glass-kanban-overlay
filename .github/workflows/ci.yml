name: build-and-test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build .\DesktopOverlayBoard.sln --configuration Release

      - name: Run tests
        run: dotnet run --project .\Tests\DesktopOverlayBoard.Tests.csproj --configuration Release --no-build
